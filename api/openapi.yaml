                detail: wallet-name not found
              schema:
                $ref: "#/components/schemas/NotFound"
          description: NotFound
        "500":
          content:
            application/json:
              example:
                detail: Ouch
              schema:
                $ref: "#/components/schemas/InternalServerError"
          description: InternalServerError
        "503":
          content:
            application/json:
              example:
                detail: Self clique unsynced
              schema:
                $ref: "#/components/schemas/ServiceUnavailable"
          description: ServiceUnavailable
        "504":
          content:
            application/json:
              example:
                detail: The network is slow
              schema:
                $ref: "#/components/schemas/GatewayTimeout"
          description: GatewayTimeout
      summary: Transfer ALPH from the active address
      tags:
      - Wallets
  /wallets/{wallet_name}/sweep-active-address:
    post:
      description: Sweep transactions are submitted in batches of two. Each non-final
