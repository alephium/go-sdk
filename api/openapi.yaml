openapi: 3.1.0
info:
  title: Alephium API
  version: 4.7.0
servers:
- url: ../
- url: "{protocol}://{host}:{port}"
  variables:
    protocol:
      default: http
      enum:
      - http
      - https
    host:
      default: 127.0.0.1
    port:
      default: "12973"
paths:
  /wallets:
    get:
      operationId: getWallets
      responses:
        "200":
          content:
            application/json:
              example:
              - walletName: wallet-super-name
                locked: true
              schema:
                items:
                  $ref: "#/components/schemas/WalletStatus"
                type: array
          description: Ok
        "400":
          content:
            application/json:
              example:
                detail: Something bad in the request
              schema:
                $ref: "#/components/schemas/BadRequest"
          description: BadRequest
        "401":
          content:
            application/json:
              example:
                detail: You shall not pass
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Unauthorized
        "404":
          content:
            application/json:
              example:
                resource: wallet-name
                detail: wallet-name not found
              schema:
                $ref: "#/components/schemas/NotFound"
          description: NotFound
        "500":
          content:
            application/json:
              example:
                detail: Ouch
              schema:
                $ref: "#/components/schemas/InternalServerError"
          description: InternalServerError
        "503":
          content:
            application/json:
              example:
                detail: Self clique unsynced
              schema:
                $ref: "#/components/schemas/ServiceUnavailable"
          description: ServiceUnavailable
        "504":
          content:
            application/json:
              example:
                detail: The network is slow
              schema:
                $ref: "#/components/schemas/GatewayTimeout"
          description: GatewayTimeout
      summary: List available wallets
      tags:
      - Wallets
    post:
      description: "A new wallet will be created and respond with a mnemonic. Make\
        \ sure to keep that mnemonic safely as it will allows you to recover your\
        \ wallet. Default mnemonic size is 24, (options: 12, 15, 18, 21, 24)."
      operationId: postWallets
      requestBody:
        content:
          application/json:
            examples:
              Example0:
                summary: User
                value:
                  password: my-secret-password
                  walletName: wallet-super-name
              Example1:
                summary: Miner (w/o pass phrase)
                value:
                  password: my-secret-password
                  walletName: wallet-super-name
                  isMiner: true
                  mnemonicSize: 24
              Example2:
                summary: Miner (with pass phrase)
                value:
                  password: my-secret-password
                  walletName: wallet-super-name
                  isMiner: true
                  mnemonicPassphrase: optional-mnemonic-passphrase
                  mnemonicSize: 24
            schema:
              $ref: "#/components/schemas/WalletCreation"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                walletName: wallet-super-name
                mnemonic: vault alarm sad mass witness property virus style good flower
                  rice alpha viable evidence run glare pretty scout evil judge enroll
                  refuse another lava
              schema:
                $ref: "#/components/schemas/WalletCreationResult"
          description: Ok
        "400":
          content:
            application/json:
              example:
                detail: Something bad in the request
              schema:
                $ref: "#/components/schemas/BadRequest"
          description: BadRequest
        "401":
          content:
            application/json:
              example:
                detail: You shall not pass
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Unauthorized
        "404":
          content:
            application/json:
              example:
                resource: wallet-name
                detail: wallet-name not found
              schema:
                $ref: "#/components/schemas/NotFound"
          description: NotFound
        "500":
          content:
            application/json:
              example:
                detail: Ouch
              schema:
                $ref: "#/components/schemas/InternalServerError"
          description: InternalServerError
        "503":
          content:
            application/json:
              example:
                detail: Self clique unsynced
              schema:
                $ref: "#/components/schemas/ServiceUnavailable"
          description: ServiceUnavailable
        "504":
          content:
            application/json:
              example:
                detail: The network is slow
              schema:
                $ref: "#/components/schemas/GatewayTimeout"
          description: GatewayTimeout
      summary: Create a new wallet
      tags:
      - Wallets
    put:
      operationId: putWallets
      requestBody:
        content:
          application/json:
            examples:
              Example0:
                summary: User
                value:
                  password: my-secret-password
                  mnemonic: vault alarm sad mass witness property virus style good
                    flower rice alpha viable evidence run glare pretty scout evil
                    judge enroll refuse another lava
                  walletName: wallet-super-name
              Example1:
                summary: Miner (w/o pass phrase)
                value:
                  password: my-secret-password
                  mnemonic: vault alarm sad mass witness property virus style good
                    flower rice alpha viable evidence run glare pretty scout evil
                    judge enroll refuse another lava
                  walletName: wallet-super-name
                  isMiner: true
              Example2:
                summary: Miner (with pass phrase)
                value:
                  password: my-secret-password
                  mnemonic: vault alarm sad mass witness property virus style good
                    flower rice alpha viable evidence run glare pretty scout evil
                    judge enroll refuse another lava
                  walletName: wallet-super-name
                  isMiner: true
                  mnemonicPassphrase: optional-mnemonic-passphrase
            schema:
              $ref: "#/components/schemas/WalletRestore"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                walletName: wallet-super-name
              schema:
                $ref: "#/components/schemas/WalletRestoreResult"
          description: Ok
        "400":
          content:
            application/json:
              example:
                detail: Something bad in the request
              schema:
                $ref: "#/components/schemas/BadRequest"
          description: BadRequest
        "401":
          content:
            application/json:
              example:
                detail: You shall not pass
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Unauthorized
        "404":
          content:
            application/json:
              example:
                resource: wallet-name
                detail: wallet-name not found
              schema:
                $ref: "#/components/schemas/NotFound"
          description: NotFound
        "500":
          content:
            application/json:
              example:
                detail: Ouch
              schema:
                $ref: "#/components/schemas/InternalServerError"
          description: InternalServerError
        "503":
          content:
            application/json:
              example:
                detail: Self clique unsynced
              schema:
                $ref: "#/components/schemas/ServiceUnavailable"
          description: ServiceUnavailable
        "504":
          content:
            application/json:
              example:
                detail: The network is slow
              schema:
                $ref: "#/components/schemas/GatewayTimeout"
          description: GatewayTimeout
      summary: Restore a wallet from your mnemonic
      tags:
      - Wallets
  /wallets/{wallet_name}:
    delete:
      operationId: deleteWalletsWallet_name
      parameters:
      - explode: false
        in: path
        name: wallet_name
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: password
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          description: Ok
        "400":
          content:
            application/json:
              example:
                detail: Something bad in the request
