          description: BadRequest
        "401":
          content:
            application/json:
              example:
                detail: You shall not pass
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Unauthorized
        "404":
          content:
            application/json:
              example:
                resource: wallet-name
                detail: wallet-name not found
              schema:
                $ref: "#/components/schemas/NotFound"
          description: NotFound
        "500":
          content:
            application/json:
              example:
                detail: Ouch
              schema:
                $ref: "#/components/schemas/InternalServerError"
          description: InternalServerError
        "503":
          content:
            application/json:
              example:
                detail: Self clique unsynced
              schema:
                $ref: "#/components/schemas/ServiceUnavailable"
          description: ServiceUnavailable
        "504":
          content:
            application/json:
              example:
                detail: The network is slow
              schema:
                $ref: "#/components/schemas/GatewayTimeout"
          description: GatewayTimeout
      summary: Delete your wallet file (can be recovered with your mnemonic)
      tags:
      - Wallets
    get:
      operationId: getWalletsWallet_name
      parameters:
      - explode: false
        in: path
        name: wallet_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                walletName: wallet-super-name
                locked: true
              schema:
                $ref: "#/components/schemas/WalletStatus"
          description: Ok
        "400":
          content:
            application/json:
              example:
                detail: Something bad in the request
              schema:
                $ref: "#/components/schemas/BadRequest"
          description: BadRequest
        "401":
          content:
            application/json:
              example:
                detail: You shall not pass
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Unauthorized
        "404":
          content:
            application/json:
              example:
                resource: wallet-name
                detail: wallet-name not found
              schema:
