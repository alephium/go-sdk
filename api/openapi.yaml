  /wallets/{wallet_name}/balances:
    get:
      operationId: getWalletsWallet_nameBalances
      parameters:
      - explode: false
        in: path
        name: wallet_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                totalBalance: "10000000000000000000"
                totalBalanceHint: 10 ALPH
                balances:
                - address: 1AujpupFP4KWeZvqA7itsHY9cLJmx4qTzojVZrg8W9y
                  balance: "10000000000000000000"
                  balanceHint: 10 ALPH
                  lockedBalance: "0"
                  lockedBalanceHint: 0 ALPH
              schema:
                $ref: "#/components/schemas/Balances"
          description: |-
            Format 1: `1000000000000000000`

            Format 2: `x.y ALPH`, where `1 ALPH = 1000000000000000000

            Field fromPublicKeyType can be  `default` or `bip340-schnorr`
        "400":
          content:
            application/json:
              example:
                detail: Something bad in the request
              schema:
                $ref: "#/components/schemas/BadRequest"
          description: BadRequest
        "401":
          content:
