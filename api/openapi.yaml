  /wallets/{wallet_name}/transfer:
    post:
      operationId: postWalletsWallet_nameTransfer
      parameters:
      - explode: false
        in: path
        name: wallet_name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              Example0:
                summary: Default
                value:
                  destinations:
                  - address: 1AujpupFP4KWeZvqA7itsHY9cLJmx4qTzojVZrg8W9y
                    attoAlphAmount: "2000000000000000000"
              Example1:
                summary: More settings
                value:
                  destinations:
                  - address: 1AujpupFP4KWeZvqA7itsHY9cLJmx4qTzojVZrg8W9y
                    attoAlphAmount: "2000000000000000000"
                    tokens:
                    - id: 2d11fd6c12435ffb07aaed4d190a505b621b927a5f6e51b61ce0ebe186397bdd
                      amount: "42000000000000000000"
                    - id: bd165d20bd063c7a023d22232a1e75bf46e904067f92b49323fe89fa0fd586bf
                      amount: "1000000000000000000000"
                    lockTime: 1611041396892
                  gas: 20000
                  gasPrice: "100000000000"
                  utxosLimit: 512
            schema:
              $ref: "#/components/schemas/Transfer"
        description: |-
          Format 1: `1000000000000000000`

          Format 2: `x.y ALPH`, where `1 ALPH = 1000000000000000000

          Field fromPublicKeyType can be  `default` or `bip340-schnorr`
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                txId: 503bfb16230888af4924aa8f8250d7d348b862e267d75d3147f1998050b6da69
